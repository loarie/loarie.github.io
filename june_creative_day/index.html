<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iNaturalist Seasonal Anomaly Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f0;
      color: #1a2e1a;
      min-height: 100vh;
    }

    header {
      background: #2d6a2d;
      color: white;
      padding: 1.5rem 2rem;
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }
    header p { font-size: 0.85rem; opacity: 0.75; margin-top: 0.25rem; }

    .container { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }

    .controls {
      background: white;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; }

    .field { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 120px; }
    .field label { font-size: 0.75rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
    .field input {
      padding: 0.5rem 0.6rem;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fafafa;
      transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: #2d6a2d; background: white; }

    .btn {
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #2d6a2d; color: white; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary { background: #e8f0e8; color: #2d6a2d; }
    .btn-secondary:hover { background: #d4e6d4; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .row-2 { margin-top: 0.75rem; }

    .status {
      font-size: 0.82rem;
      color: #666;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #ccc;
      border-top-color: #2d6a2d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cards { display: flex; flex-direction: column; gap: 1rem; }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
      display: flex;
      gap: 0;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .card-photo {
      width: 180px;
      min-width: 180px;
      background: #e8f0e8;
      position: relative;
      overflow: hidden;
    }
    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-photo .no-photo {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 2.5rem;
    }

    .card-body { padding: 1rem 1.1rem; flex: 1; min-width: 0; }

    .card-question {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.35rem;
      color: #1a2e1a;
    }

    .card-names {
      margin-bottom: 0.55rem;
    }
    .card-names .common { font-size: 0.88rem; font-weight: 600; color: #333; }
    .card-names .sci    { font-size: 0.78rem; font-style: italic; color: #888; display: block; }

    .card-body-text {
      font-size: 0.87rem;
      color: #444;
      line-height: 1.55;
      margin-bottom: 0.65rem;
    }
    .card-body-text p { margin: 0 0 0.3rem; }
    .card-body-text p:last-child { margin-bottom: 0; }

    .card-cta {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #2d6a2d;
      background: #e8f5e8;
      padding: 0.25rem 0.65rem;
      border-radius: 5px;
      text-decoration: none;
      margin-bottom: 0.7rem;
    }
    .card-cta:hover { background: #d0ead0; }

    .card-stats {
      font-size: 0.78rem;
      color: #777;
      line-height: 1.7;
      border-top: 1px solid #f0f0f0;
      padding-top: 0.55rem;
    }
    .card-stats strong { color: #444; }

    .error-box {
      background: #fff0f0;
      border: 1.5px solid #f0c0c0;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      color: #c00;
      font-size: 0.87rem;
      margin-top: 0.5rem;
    }

    .intro-blurb {
      background: white;
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 1rem;
      font-size: 0.92rem;
      color: #444;
      line-height: 1.6;
    }
    .intro-blurb strong { color: #1a2e1a; }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 2rem;
      font-size: 0.9rem;
    }

    /* Iconic taxon colors */
    .taxon-Aves      { background: #cce5ff; color: #0055aa; }
    .taxon-Mammalia  { background: #ffe0b2; color: #7a3800; }
    .taxon-Reptilia  { background: #c8e6c9; color: #1b5e20; }
    .taxon-Amphibia  { background: #b2dfdb; color: #004d40; }
    .taxon-Insecta   { background: #fff9c4; color: #6d5500; }
    .taxon-Arachnida { background: #f8bbd0; color: #880e4f; }
    .taxon-Plantae   { background: #dcedc8; color: #33691e; }
    .taxon-Fungi     { background: #e1bee7; color: #4a148c; }
    .taxon-default   { background: #f0f0f0; color: #555; }

    #map {
      height: 260px;
      border-radius: 8px;
      margin-top: 0.75rem;
      border: 1.5px solid #ddd;
      cursor: crosshair;
    }
    .map-coords {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.35rem;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<header>
  <h1>🕵️ Nature Mysteries Nearby</h1>
  <p>Pick a spot on the map to find species that should be here by now — but aren't</p>
</header>

<div class="container">
  <div class="controls">
    <div class="row" style="align-items:flex-end;">
      <div class="field" style="min-width:140px;">
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div class="field" style="max-width:100px;">
        <label>Radius (km)</label>
        <input type="number" id="radius" value="10" min="1" max="50" oninput="updateCircle()">
      </div>
      <div style="margin-left:auto; display:flex; gap:0.5rem; align-items:flex-end;">
        <button class="btn btn-primary" id="runBtn" onclick="run()">Find Mysteries</button>
      </div>
    </div>
    <div id="map"></div>
    <div class="map-coords" id="coords-display"></div>
    <input type="hidden" id="lat">
    <input type="hidden" id="lng">
    <div class="status" id="status"></div>
  </div>

  <div id="results"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── defaults ──────────────────────────────────────────────────────────────────
const today = new Date().toISOString().slice(0, 10);
document.getElementById("date").value = today;

const DEFAULT_LAT = 37.9689175373541;
const DEFAULT_LNG = -122.53646376340167;

// ── map setup ─────────────────────────────────────────────────────────────────
const map = L.map("map").setView([DEFAULT_LAT, DEFAULT_LNG], 11);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

const marker = L.marker([DEFAULT_LAT, DEFAULT_LNG], { draggable: true }).addTo(map);
let circle = L.circle([DEFAULT_LAT, DEFAULT_LNG], {
  radius: 10000,
  color: "#2d6a2d",
  fillColor: "#2d6a2d",
  fillOpacity: 0.08,
  weight: 1.5
}).addTo(map);

function setLocation(lat, lng) {
  document.getElementById("lat").value = lat;
  document.getElementById("lng").value = lng;
  document.getElementById("coords-display").textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  marker.setLatLng([lat, lng]);
  circle.setLatLng([lat, lng]);
}

function updateCircle() {
  const km = parseFloat(document.getElementById("radius").value) || 5;
  circle.setRadius(km * 1000);
}

marker.on("dragend", e => {
  const { lat, lng } = e.target.getLatLng();
  setLocation(lat, lng);
});

map.on("click", e => {
  setLocation(e.latlng.lat, e.latlng.lng);
});


setLocation(DEFAULT_LAT, DEFAULT_LNG);

const HISTORIC_YEARS   = [2021, 2022, 2023, 2024, 2025];
const COOL_ICONIC_TAXA = new Set(["Amphibia","Reptilia","Aves","Mammalia","Fungi","Insecta","Arachnida","Plantae"]);
const TAXON_EMOJI      = {
  Aves: "🐦", Mammalia: "🦌", Reptilia: "🦎", Amphibia: "🐸",
  Insecta: "🦋", Arachnida: "🕷️", Plantae: "🌿", Fungi: "🍄"
};

// ── iNaturalist API helpers ────────────────────────────────────────────────────
async function fetchJSON(url, params) {
  const u = new URL(url);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const res = await fetch(u.toString());
  if (!res.ok) throw new Error(`HTTP ${res.status} from ${url}`);
  return res.json();
}

async function obsCount(params) {
  const data = await fetchJSON(
    "https://api.inaturalist.org/v1/observations",
    { ...params, per_page: 0 }
  );
  return data.total_results;
}

async function taxonomy(params) {
  return fetchJSON("https://api.inaturalist.org/v1/observations/taxonomy", params);
}

function speciesCounts(taxData) {
  const map = {};
  for (const r of taxData.results || []) {
    if (r.rank === "species" && r.is_active) {
      map[r.id] = {
        id: r.id,
        name: r.name,
        iconic_taxon_name: r.iconic_taxon_name,
        count: r.descendant_obs_count || 0
      };
    }
  }
  return map;
}

// ── statistics ────────────────────────────────────────────────────────────────
function poissonCDF(observed, lambda) {
  if (lambda <= 0) return 1.0;
  let term = Math.exp(-lambda);
  let sum  = term;
  for (let k = 1; k <= observed; k++) {
    term *= lambda / k;
    sum  += term;
  }
  return sum;
}

function surpriseScore(observed, expected) {
  let p = poissonCDF(observed, expected);
  if (p < 1e-300) p = 1e-300;
  return -Math.log10(p);
}

// ── taxon photos & names ──────────────────────────────────────────────────────
async function fetchTaxaDetails(ids) {
  if (!ids.length) return {};
  const data = await fetchJSON(
    "https://api.inaturalist.org/v1/taxa",
    { id: ids.join(","), per_page: 30 }
  );
  const map = {};
  for (const t of data.results || []) {
    map[t.id] = {
      commonName: t.preferred_common_name || null,
      photoUrl: t.default_photo?.medium_url || t.default_photo?.url || null,
      attribution: t.default_photo?.attribution || null
    };
  }
  return map;
}

// ── month helpers ─────────────────────────────────────────────────────────────
function monthName(m) {
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];
}

function dateStr(year, month, day) {
  return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

// ── main algorithm ────────────────────────────────────────────────────────────
async function findAnomalies(lat, lng, radius, dateStr_target) {
  const [yr, mo, dy] = dateStr_target.split("-").map(Number);

  const base = {
    lat, lng,
    radius: radius,
    verifiable: true,
    quality_grade: "research,needs_id"
  };

  setStatus("Checking what's been spotted this season…");

  const currentD1 = dateStr(yr, mo, 1);
  const currentD2 = dateStr(yr, mo, dy);

  const [currentTotal, currentTaxData] = await Promise.all([
    obsCount({ ...base, d1: currentD1, d2: currentD2 }),
    taxonomy({ ...base, d1: currentD1, d2: currentD2 })
  ]);

  const currentSpecies = speciesCounts(currentTaxData);

  setStatus(`Digging through ${HISTORIC_YEARS.length} years of iNaturalist history…`);

  // Fetch all historic years in parallel
  const historicResults = await Promise.all(
    HISTORIC_YEARS.map(async year => {
      const d1 = dateStr(year, mo, 1);
      const d2 = dateStr(year, mo, dy);
      const [total, taxData] = await Promise.all([
        obsCount({ ...base, d1, d2 }),
        taxonomy({ ...base, d1, d2 })
      ]);
      return { year, total, species: speciesCounts(taxData) };
    })
  );

  setStatus("Looking for unusual patterns…");

  // Aggregate historic data per taxon
  const historic = {};
  for (const { year, total, species } of historicResults) {
    for (const [tid, taxon] of Object.entries(species)) {
      if (!historic[tid]) {
        historic[tid] = {
          ...taxon,
          yearlyRates: {},
          yearsSeen: 0,
          totalHistoricCount: 0
        };
      }
      const rate = total > 0 ? taxon.count / total : 0;
      historic[tid].yearlyRates[year] = rate;
      if (taxon.count > 0) historic[tid].yearsSeen++;
      historic[tid].totalHistoricCount += taxon.count;
    }
  }

  // Score candidates
  const candidates = Object.values(historic)
    .map(taxon => {
      const observed   = (currentSpecies[taxon.id]?.count) || 0;
      const rates      = Object.values(taxon.yearlyRates);
      const meanRate   = rates.reduce((a, b) => a + b, 0) / HISTORIC_YEARS.length;
      const expected   = meanRate * currentTotal;
      const surprise   = surpriseScore(observed, expected);
      return { ...taxon, observed, expected, meanRate, surprise };
    })
    .filter(t => t.expected >= 2.0)
    .filter(t => t.observed < t.expected)
    .filter(t => COOL_ICONIC_TAXA.has(t.iconic_taxon_name))
    .sort((a, b) => b.surprise - a.surprise)
    .slice(0, 5);

  if (!candidates.length) return [];

  setStatus("Almost there — fetching photos…");
  const taxaDetails = await fetchTaxaDetails(candidates.map(t => t.id));

  return candidates.map(t => ({
    ...t,
    ...taxaDetails[t.id],
    currentWindow: `${monthName(mo)} 1–${dy}, ${yr}`,
    historicWindow: `${HISTORIC_YEARS[0]}–${HISTORIC_YEARS[HISTORIC_YEARS.length - 1]}`,
    currentTotal
  }));
}

// ── UI ────────────────────────────────────────────────────────────────────────
function setStatus(msg, spin = true) {
  const el = document.getElementById("status");
  el.innerHTML = msg
    ? (spin ? `<span class="spinner"></span>${msg}` : msg)
    : "";
}


// ── fun language helpers ──────────────────────────────────────────────────────
const TAXON_PLURAL = {
  Aves: "birds", Mammalia: "mammals", Reptilia: "reptiles",
  Amphibia: "amphibians", Insecta: "insects", Arachnida: "spiders",
  Plantae: "plants", Fungi: "fungi"
};

function pluralize(name) {
  if (!name) return name;
  const lower = name.toLowerCase();
  if (lower.endsWith("s") || lower.endsWith("x") || lower.endsWith("z")) return name + "es";
  if (lower.endsWith("y") && !/[aeiou]y$/.test(lower)) return name.slice(0, -1) + "ies";
  return name + "s";
}

const MONTH_NAMES = ["January","February","March","April","May","June",
                     "July","August","September","October","November","December"];

function usuallyText(card, mo) {
  const display   = card.commonName || card.name;
  const plural    = pluralize(display);
  const group     = TAXON_PLURAL[card.iconic_taxon_name] || "species";
  const monthName = MONTH_NAMES[mo - 1];
  const midMonth  = `mid-${monthName}`;
  const ratio     = card.yearsSeen / HISTORIC_YEARS.length;

  if (ratio >= 1)   return `${plural} are one of the most reliably spotted ${group} in the area by ${midMonth}.`;
  if (ratio >= 0.8) return `${plural} regularly turn up in the area by ${midMonth}.`;
  return `${plural} usually start appearing in the area by ${midMonth}.`;
}

function thisYearText(card) {
  const ratio = card.observed / card.expected;
  if (ratio <= 0.15) return "This year, they've been almost impossible to find.";
  if (ratio <= 0.35) return "This year they've been surprisingly hard to find.";
  if (ratio <= 0.55) return "This season, sightings have been much lower than expected.";
  return "This season, observers are finding far fewer than expected.";
}

const CTAS = [
  "Help solve the mystery →",
  "Go looking →",
  "See if you can find one →",
  "Report a sighting →",
  "Can you find one? →"
];

function renderCards(cards, lat, lng, radius) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  if (!cards.length) {
    container.innerHTML = `<div class="empty-state">Nature seems right on schedule here — no surprises found.<br>Try a wider radius or a different location.</div>`;
    return;
  }

  const [,, mo] = cards[0].currentWindow ? [] : [];
  const dateVal = document.getElementById("date").value;
  const mo_num  = parseInt(dateVal.split("-")[1]);
  const dy_num  = parseInt(dateVal.split("-")[2]);
  const monthDisp = MONTH_NAMES[mo_num - 1];

  const intro = document.createElement("div");
  intro.className = "intro-blurb";
  intro.innerHTML = `<strong>Something's different this season.</strong> These species are usually turning up all over the area by now, but observations have been surprisingly scarce. Can you help solve the mystery?`;
  container.appendChild(intro);

  const wrapper = document.createElement("div");
  wrapper.className = "cards";

  cards.forEach((card, i) => {
    const icon    = TAXON_EMOJI[card.iconic_taxon_name] || "🌿";
    const display = card.commonName || card.name;
    const exp     = Math.round(card.expected);
    const obs     = card.observed;
    const iNatUrl = `https://www.inaturalist.org/observations?lat=${lat}&lng=${lng}&radius=${radius}&subview=map&taxon_id=${card.id}`;

    const el = document.createElement("div");
    el.className = "card";
    el.style.animationDelay = `${i * 0.08}s`;

    const photoHtml = card.photoUrl
      ? `<img src="${card.photoUrl}" alt="${card.name}" loading="lazy">`
      : `<div class="no-photo">${icon}</div>`;

    el.innerHTML = `
      <div class="card-photo">${photoHtml}</div>
      <div class="card-body">
        <div class="card-question">${icon} Where Are the ${pluralize(display)}?</div>
        <div class="card-names">
          <span class="common">${display}</span>
          ${card.commonName ? `<span class="sci">${card.name}</span>` : ""}
        </div>
        <div class="card-body-text">
          <p>${usuallyText(card, mo_num)}</p>
          <p>${thisYearText(card)}</p>
        </div>
        <a class="card-cta" href="${iNatUrl}" target="_blank" rel="noopener">${CTAS[i % CTAS.length]}</a>
        <div class="card-stats">
          Typically found by now: <strong>~${exp} observation${exp === 1 ? "" : "s"}</strong><br>
          Reported so far: <strong>${obs} observation${obs === 1 ? "" : "s"}</strong><br>
          Seen in <strong>${card.yearsSeen} of the last ${HISTORIC_YEARS.length} years</strong> nearby
        </div>
      </div>
    `;
    wrapper.appendChild(el);
  });

  container.appendChild(wrapper);
}

async function run() {
  const date   = document.getElementById("date").value;
  const lat    = parseFloat(document.getElementById("lat").value);
  const lng    = parseFloat(document.getElementById("lng").value);
  const radius = parseFloat(document.getElementById("radius").value) || 5;

  if (!date || isNaN(lat) || isNaN(lng)) {
    setStatus("Please fill in all fields.", false);
    return;
  }

  document.getElementById("runBtn").disabled = true;
  document.getElementById("results").innerHTML = "";

  try {
    const cards = await findAnomalies(lat, lng, radius, date);
    renderCards(cards, lat, lng, radius);
    setStatus(cards.length
      ? `Found ${cards.length} nature myster${cards.length === 1 ? "y" : "ies"} — go explore!`
      : "No mysteries this time — nature is right on schedule.", false);
  } catch (err) {
    document.getElementById("results").innerHTML =
      `<div class="error-box">Error: ${err.message}</div>`;
    setStatus("", false);
    console.error(err);
  } finally {
    document.getElementById("runBtn").disabled = false;
  }
}
</script>
</body>
</html>
