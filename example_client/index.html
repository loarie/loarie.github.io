<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iNat Example Client - OAuth Callback</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 80px auto;
    padding: 0 20px;
    color: #222;
    line-height: 1.5;
  }
  code {
    background: #f0f0f0;
    padding: 2px 6px;
    border-radius: 4px;
    word-break: break-all;
  }
  .code-box {
    margin-top: 16px;
    padding: 12px 16px;
    background: #f0f7e6;
    border: 1px solid #74ac00;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <h1>iNat Example Client</h1>
  <p id="message">
    This page is the OAuth redirect URI registered for the "iNat Example
    Client" app. If you're testing the login flow inside the mobile app,
    you shouldn't normally see this page &mdash; the app intercepts this
    redirect before it loads.
  </p>
  <div id="codeBox" class="code-box" style="display:none">
    <p>Authorization code received:</p>
    <code id="codeValue"></code>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    if (code) {
      document.getElementById('codeBox').style.display = 'block';
      document.getElementById('codeValue').textContent = code;
    } else if (error) {
      document.getElementById('message').textContent =
        'Authorization was not granted (' + error + ').';
    }
  </script>
</body>
</html>
